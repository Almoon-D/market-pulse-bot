[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-pulse-bot"
version = "1.1.0"
description = "Deterministic global stock-exchange market-status monitor with Discord, Slack and Telegram backends."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Almoon.D" },
]
keywords = ["stock-exchanges", "market-status", "trading-calendar", "discord", "slack", "telegram"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pydantic>=2.12",
  "pydantic-settings>=2.14",
  "exchange_calendars>=4.13.2,<5",
  "numpy>=2.3,<2.4",
  "httpx>=0.28",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
market-pulse-bot = "market_pulse_bot.app:main"

[project.urls]
Homepage = "https://github.com/Almoon-D/market-pulse-bot"
Repository = "https://github.com/Almoon-D/market-pulse-bot"
Issues = "https://github.com/Almoon-D/market-pulse-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "exchange_calendars"
ignore_missing_imports = true
