[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-market-ops-monitor"
version = "1.0.0"
description = "Real-time operational-state monitor for global stock exchanges"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Open-source contributors" }]
dependencies = [
  "pydantic>=2.12",
  "pydantic-settings>=2.14",
  "exchange_calendars>=4.13.2",
  "httpx>=0.28",
  "PyYAML>=6.0",
]

[project.scripts]
market-monitor = "main:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
