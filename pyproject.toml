[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mercados"
version = "1.0.0"
description = "Real-time operational state tracker for global stock exchanges with unscheduled market-wide closure detection."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.14",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28",
    "PyYAML>=6.0.2",
]

[project.scripts]
mercados = "main:cli_entry"

[tool.setuptools]
packages = ["src"]
py-modules = ["main"]
