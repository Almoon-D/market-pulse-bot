# The 4 fully-worked anchor exchanges (Section 6). Run
#   python main.py init-config
# to additively scaffold the other 20 (TSX, B3, LSE, Xetra, Euronext x3, SIX,
# HKEX, SSE, SZSE, BSE, NSE India, KRX, TWSE, SGX, ASX, Cboe Australia, Chi-X, NZX).
exchanges:
- name: NYSE
  mic: XNYS
  calendar_type: exchange_calendars
  timezone: America/New_York
  tz_label: ET
  country_flag: 🇺🇸
  currency: USD
  region: America
  session_offsets:
    pre_market_minutes: 330
    opening_auction_minutes: 0
    closing_auction_minutes: 10
    post_market_minutes: 240
  incident_source:
    type: structured_feed
    url: https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts
    scope: single_stock
- name: Bolsa de Madrid
  mic: XMAD
  calendar_type: exchange_calendars
