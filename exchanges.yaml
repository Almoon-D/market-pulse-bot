# config/exchanges.yaml
# MIC codes are INTERNAL ONLY — never rendered in output.
exchanges:
  - name: "NYSE"
    mic: "XNYS"
    calendar_type: "exchange_calendars"
    timezone: "America/New_York"
    tz_label: "ET"
    country_flag: "🇺🇸"
    currency: "USD"
    region: "America"
    session_offsets:
      pre_market_minutes: 330
      opening_auction_minutes: 0
      closing_auction_minutes: 10
      post_market_minutes: 240
    incident_source:
      type: "structured_feed"
      url: "https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts"
      scope: "single_stock"   # never triggers 🚨 alone

  - name: "BME / Bolsa de Madrid"
    mic: "XMAD"               # calendar MIC is XMAD, not BMEX
    calendar_type: "exchange_calendars"
    timezone: "Europe/Madrid"
    tz_label: "CET/CEST"
    country_flag: "🇪🇸"
    currency: "EUR"
    region: "Europe"
    session_offsets:
      pre_market_minutes: 90
      opening_auction_minutes: 30
      closing_auction_minutes: 5
      post_market_minutes: 30
    incident_source:
      type: "manual"
      url: null
      scope: "market_wide"

  - name: "Tokyo Stock Exchange"
    mic: "XTKS"
    calendar_type: "exchange_calendars"
    timezone: "Asia/Tokyo"
    tz_label: "JST"
    country_flag: "🇯🇵"
    currency: "JPY"
    region: "Asia"
    lunch_break:
      start: "11:30"
      end: "12:30"
    session_offsets:
      pre_market_minutes: 60
      opening_auction_minutes: 0
      closing_auction_minutes: 5
      post_market_minutes: 30
    incident_source:
      type: "manual"
      url: null
      scope: "market_wide"

  - name: "South Pacific Exchange (synthetic, Fiji)"
    mic: "XSPX"
    calendar_type: "synthetic"
    timezone: "Pacific/Fiji"    # UTC+12
    tz_label: "FJT"
    country_flag: "🇫🇯"
    currency: "FJD"
    region: "Oceania"
    synthetic_schedule:
      open: "10:00"
      close: "12:00"
      trading_days: [1, 2, 3, 4, 5]   # ISO weekdays Mon=1
    session_offsets:
      pre_market_minutes: 30
      opening_auction_minutes: 0
      closing_auction_minutes: 0
      post_market_minutes: 15
    incident_source:
      type: "manual"
      url: null
      scope: "market_wide"
