    currency: EUR
    region: Europe
    session_offsets: {pre_market_minutes: 0, opening_auction_minutes: 30, closing_auction_minutes: 5, post_market_minutes: 10}
    phase_windows:
      - {phase: opening_auction, anchor: session_open, start_offset_minutes: -30, end_offset_minutes: 0}
      - {phase: closing_auction, anchor: session_close, start_offset_minutes: 0, end_offset_minutes: 5}
      - {phase: post_market, anchor: session_close, start_offset_minutes: 5, end_offset_minutes: 15}
    incident_source:
      type: manual
      scope: market_wide

