exchanges:
  - name: NYSE
    mic: XNYS
    calendar_type: exchange_calendars
    timezone: America/New_York
    tz_label: ET
    country_flag: 🇺🇸
    currency: USD
    region: America
    session_offsets: {pre_market_minutes: 180, opening_auction_minutes: 0, closing_auction_minutes: 0, post_market_minutes: 240}
    phase_windows:
      - {phase: pre_market, anchor: session_open, start_offset_minutes: -180, end_offset_minutes: 0}
      - {phase: post_market, anchor: session_close, start_offset_minutes: 0, end_offset_minutes: 240}
    incident_source:
      type: structured_feed
      url: https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts
      scope: single_stock

  - name: Bolsa de Madrid
